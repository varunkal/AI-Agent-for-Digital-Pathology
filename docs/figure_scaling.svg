<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="480" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#111">Retrieval accuracy vs. corpus size</text>
  <text x="360" y="55" text-anchor="middle" font-size="13" fill="#555">Top-5 accuracy on the same 30 questions, as the codebase grows 49 &#8594; 610 files</text>

  <!-- plot area: x 110..640, y 90..390. y: 40%..100% -->
  <!-- axes -->
  <line x1="110" y1="390" x2="640" y2="390" stroke="#333" stroke-width="1.5"/>
  <line x1="110" y1="90" x2="110" y2="390" stroke="#333" stroke-width="1.5"/>

  <!-- y gridlines 40,50,60,70,80,90,100 -> y = 390 - (val-40)/60*300 -->
  <!-- 40:390 50:340 60:290 70:240 80:190 90:140 100:90 -->
  <g font-size="11" fill="#888">
    <line x1="110" y1="90"  x2="640" y2="90"  stroke="#eee"/><text x="102" y="94" text-anchor="end">100%</text>
    <line x1="110" y1="140" x2="640" y2="140" stroke="#eee"/><text x="102" y="144" text-anchor="end">90%</text>
    <line x1="110" y1="190" x2="640" y2="190" stroke="#eee"/><text x="102" y="194" text-anchor="end">80%</text>
    <line x1="110" y1="240" x2="640" y2="240" stroke="#eee"/><text x="102" y="244" text-anchor="end">70%</text>
    <line x1="110" y1="290" x2="640" y2="290" stroke="#eee"/><text x="102" y="294" text-anchor="end">60%</text>
    <line x1="110" y1="340" x2="640" y2="340" stroke="#eee"/><text x="102" y="344" text-anchor="end">50%</text>
  </g>
  <!-- x ticks: 49 -> x=170, 610 -> x=600 -->
  <text x="170" y="410" text-anchor="middle" font-size="12" fill="#333">49 files</text>
  <text x="600" y="410" text-anchor="middle" font-size="12" fill="#333">610 files</text>
  <text x="360" y="440" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">Corpus size &#8594;</text>
  <text x="34" y="240" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" transform="rotate(-90 34 240)">Top-5 accuracy &#8594;</text>

  <!-- data: 49f: sem 88(y=150), key 88(150), hyb 96(114) ; 610f: sem 56(y=308), key 88(150), hyb 88(150) -->
  <!-- 88% -> 390-(88-40)/60*300 = 390-240 =150 ; 96% ->390-280=110? recompute: (96-40)/60*300=280 ->390-280=110 ; 56% ->(16)/60*300=80 ->310 -->
  <!-- keyword line (flat, on top) -->
  <line x1="170" y1="150" x2="600" y2="150" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="170" cy="150" r="5" fill="#c0392b"/><circle cx="600" cy="150" r="5" fill="#c0392b"/>
  <text x="612" y="146" font-size="12" fill="#c0392b" font-weight="bold">Keyword</text>
  <text x="612" y="160" font-size="10" fill="#c0392b">88% &#8594; 88%</text>

  <!-- hybrid line -->
  <line x1="170" y1="110" x2="600" y2="150" stroke="#01693E" stroke-width="3"/>
  <circle cx="170" cy="110" r="5" fill="#01693E"/><circle cx="600" cy="150" r="5" fill="#01693E"/>
  <text x="150" y="102" font-size="12" fill="#01693E" font-weight="bold">Hybrid 96%</text>

  <!-- semantic line (dives) -->
  <line x1="170" y1="150" x2="600" y2="310" stroke="#2874a6" stroke-width="2.5"/>
  <circle cx="170" cy="150" r="5" fill="#2874a6"/><circle cx="600" cy="310" r="5" fill="#2874a6"/>
  <text x="612" y="314" font-size="12" fill="#2874a6" font-weight="bold">Semantic</text>
  <text x="612" y="328" font-size="10" fill="#2874a6">88% &#8594; 56%</text>

  <text x="360" y="466" text-anchor="middle" font-size="11" fill="#777" font-style="italic">Semantic search collapses as distractor files grow; keyword stays flat; hybrid tracks the stronger of the two. (n=25, Top-5)</text>
</svg>
